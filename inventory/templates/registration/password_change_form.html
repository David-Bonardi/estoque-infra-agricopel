{% extends 'inventory/base.html' %}
{% block content %}
<section class="card entry login">
  <p class="eyebrow">MINHA CONTA</p>
  <h1>Trocar senha</h1>
  <p class="muted">Informe sua senha atual e escolha uma nova senha para acessar o estoque.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit">Salvar nova senha</button>
      <a class="button button-secondary" href="{% url 'dashboard' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
