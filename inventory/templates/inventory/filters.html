<form method="get" class="filters"><div><label for="q">Buscar</label><input id="q" name="q" value="{{ q }}" placeholder="Item ou patrimônio"></div><div><label for="branch">Filial</label><select id="branch" name="branch"><option value="">Todas as filiais</option>{% for branch in branches %}<option value="{{ branch.pk }}" {% if selected_branch == branch.pk|stringformat:'s' %}selected{% endif %}>{{ branch }}</option>{% endfor %}</select></div><div class="filter-actions"><button type="submit">Filtrar</button><a class="button button-secondary" href="{{ request.path }}">Limpar</a></div></form>
