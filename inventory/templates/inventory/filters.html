<form method="get" class="filters"><div><label for="q">Buscar</label><input id="q" name="q" value="{{ q }}" placeholder="Item ou patrimônio"></div><div><label for="branch">Filial</label><select id="branch" name="branch"><option value="">Todas as filiais</option>{% for branch in branches %}<option value="{{ branch.pk }}" {% if selected_branch == branch.pk|stringformat:'s' %}selected{% endif %}>{{ branch }}</option>{% endfor %}</select></div>{% if categories %}<div><label for="category">Categoria</label><select id="category" name="category"><option value="">Todas as categorias</option>{% for category in categories %}<option value="{{ category }}" {% if selected_category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div>{% endif %}<div class="filter-actions"><button type="submit">Filtrar</button><a class="button button-secondary" href="{{ request.path }}">Limpar</a></div></form>
